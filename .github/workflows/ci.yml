name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests (catalog sidecars, theme, maplibre)
        run: pnpm test

      - name: Typecheck (preview app + tests)
        run: pnpm typecheck

      - name: Theme surface check
        run: pnpm theme:check

      - name: Preview build (import resolution across the registry)
        run: pnpm preview:build
